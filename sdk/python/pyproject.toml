[project]
name = "miira-vibe"
version = "1.0.0"
description = "SlopTown platform SDK for Vibe apps: identity, members, AI. Baked into vibe-base; not edited by apps."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "starlette>=0.40",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "uvicorn>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["miira_vibe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
