[project]
name = "sloptown"
version = "0.1.0"
description = "SlopTown control plane and egress/inference proxy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "pydantic-settings>=2.6",
  "sse-starlette>=2.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sloptown"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
