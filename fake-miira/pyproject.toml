[project]
name = "fake-miira"
version = "0.1.0"
description = "Dev-only stand-in for Miira: OIDC, launch token, members API, access webhook, admin caller"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fake_miira"]
